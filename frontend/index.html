<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1f21" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Study</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("study.theme") || "dark";
          var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
          // Phone status and navigation bars take the page's background (keep in sync with --canvas).
          document.querySelector('meta[name="theme-color"]').setAttribute("content", isDark ? "#1e1f21" : "#f9fafb");
          // Fonts chosen in Settings (cached copy of the account preference). Keep in sync with lib/preferences.ts.
          var prefs = JSON.parse(localStorage.getItem("study.prefs") || "{}");
          var reading = {
            instrument: '"Instrument Sans Variable", ui-sans-serif, system-ui, sans-serif',
            "system-serif": 'Georgia, "Times New Roman", Times, serif',
            "system-sans": 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
          }[prefs.readingFont];
          var ui = prefs.uiFont === "system" ? 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' : null;
          if (reading) document.documentElement.style.setProperty("--reading-font", reading);
          if (ui) document.documentElement.style.setProperty("--ui-font", ui);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
